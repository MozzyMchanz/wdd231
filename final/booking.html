<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexoth Physiotherapy & Wellness Portal | Book Appointment</title>
  <meta name="description" content="Book a physiotherapy appointment at Nexoth. Choose your service, date, and preferred time online easily.">
  <meta name="author" content="BWIRE MOSES">

  <link rel="icon" href="images/favicon.ico">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/larger.css">

  <!-- Open Graph Protocol -->
  <meta property="og:title" content="Nexoth Physiotherapy | Book Appointment">
  <meta property="og:description" content="Schedule your personalized physiotherapy appointment online with Nexoth.">
  <meta property="og:image" content="https://mozzymchanz.github.io/wdd231/final/images/og-share.jpg">
  <meta property="og:url" content="https://mozzymchanz.github.io/wdd231/final/booking.html">
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo-text">Nexoth Wellness</a>
      <button id="menu-button" aria-label="Toggle Navigation">&#9776;</button>
      <nav id="primary-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="booking.html" class="active">Booking</a></li>
          <li><a href="attributions.html">Attributions</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Book Your Appointment</h1>
    <form id="booking-form" class="card" method="get" action="booking-success.html">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" autocomplete="given-name" title="Please enter your full name." required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="example@domain.com" title="Please enter a valid email address." required>
      </div>

      <div class="form-group">
        <label for="service-select">Select Service</label>
        <select id="service-select" name="service" title="Select a service." required>
          <option value="" disabled selected>-- Choose a Service --</option>
          <!-- Options populated from data/services.json via booking.js -->
        </select>
      </div>

      <div class="form-group">
        <label for="appointment-date">Preferred Date</label>
        <input type="date" id="appointment-date" name="date" title="Choose your preferred appointment date." required>
      </div>

      <button type="submit" class="cta-button">Confirm Booking</button>
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Nexoth Physiotherapy | BWIRE MOSES | WDD 231</p>
    <p id="lastModified"></p>
    <p><a href="attributions.html">Attributions</a></p>
  </footer>

  <script src="scripts/main.js" type="module"></script>
  <script src="scripts/booking.js" type="module"></script>
</body>
</html>
